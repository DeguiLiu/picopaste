name: ci

on:
  push:
  pull_request:

env:
  # The Windows platform layer lives on this branch of newosp until it merges.
  PICOPASTE_NEWOSP_REPO: https://github.com/DeguiLiu/newosp.git
  PICOPASTE_NEWOSP_REF: windows

jobs:
  linux:
    name: linux / gcc (core + tests, sanitizers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Comma, not '+': GCC rejects -fsanitize=address+undefined
        # (verified on g++ 11), while the comma form is accepted by GCC/Clang.
        sanitizer: ["none", "address,undefined"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newosp
        run: git clone --depth 1 --branch "$PICOPASTE_NEWOSP_REF" "$PICOPASTE_NEWOSP_REPO" "$HOME/newosp-windows"

      - name: Configure
        run: |
          FLAGS=""
          if [ "${{ matrix.sanitizer }}" != "none" ]; then
            FLAGS="-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.sanitizer }} -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.sanitizer }}"
          fi
          cmake -S . -B build -DPICOPASTE_BUILD_TESTS=ON -DPICOPASTE_WERROR=ON \
            -DPICOPASTE_NEWOSP_DIR="$HOME/newosp-windows" $FLAGS

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Runs the full ctest suite, which includes the mechanical gates
      # (gate_no_scripts, gate_posix_leak) registered in tests/CMakeLists.txt.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows / msvc (build + smoke)
    # This is the ONLY gate that can catch MSVC-only blockers. A mingw
    # cross-compile cannot: mingw defines __GNUC__ and ships pthread.h and
    # unistd.h, so it happily compiles headers that MSVC rejects.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newosp
        shell: pwsh
        run: git clone --depth 1 --branch "$env:PICOPASTE_NEWOSP_REF" "$env:PICOPASTE_NEWOSP_REPO" "$env:USERPROFILE/newosp-windows"

      - name: Configure
        shell: pwsh
        # Pass the newosp path explicitly: the CMake default is $ENV{HOME} and
        # Windows runners do not guarantee HOME==USERPROFILE.
        run: cmake -S . -B build -A x64 -DPICOPASTE_BUILD_TESTS=ON -DPICOPASTE_WERROR=ON -DPICOPASTE_NEWOSP_DIR="$env:USERPROFILE/newosp-windows"

      - name: Build
        run: cmake --build build --config Release

      # ctest includes the CMake-script gates registered in tests/CMakeLists.txt
      # (gate_no_scripts, gate_posix_leak); the latter correctly excludes
      # src/platform/posix/, which is legitimate POSIX and not built on Windows.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
