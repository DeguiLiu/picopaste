name: ci

on:
  push:
  pull_request:

env:
  # The Windows platform layer lives on this branch of newosp until it merges.
  PICOPASTE_NEWOSP_REPO: https://github.com/DeguiLiu/newosp.git
  # Pinned to a COMMIT on the `windows` branch, not to the branch itself. The
  # branch is genuinely required (main lacks the RT_VERSION fix, so any Windows
  # TU fails to compile), and that is exactly why a moving ref is wrong here: a
  # force-push or a merge-and-delete would break this build with no change in
  # this repo. Keep the branch name for humans; update with:
  #   git ls-remote https://github.com/DeguiLiu/newosp.git refs/heads/windows
  PICOPASTE_NEWOSP_REF: 67c0a23b74d15f8ac33439072dea722631c530f5

jobs:
  linux:
    name: linux / gcc (core + tests, sanitizers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Comma, not '+': GCC rejects -fsanitize=address+undefined
        # (verified on g++ 11), while the comma form is accepted by GCC/Clang.
        sanitizer: ["none", "address,undefined"]
    steps:
      - uses: actions/checkout@v4

      # Fetch by SHA, not `clone --branch`: --branch only accepts a branch or
      # tag name, so a commit pin needs init + fetch + detached checkout. The
      # checkout must still land at $HOME/newosp-windows, because Configure
      # points PICOPASTE_NEWOSP_DIR at it.
      - name: Fetch newosp
        run: |
          git init "$HOME/newosp-windows"
          git -C "$HOME/newosp-windows" remote add origin "$PICOPASTE_NEWOSP_REPO"
          git -C "$HOME/newosp-windows" fetch --depth 1 origin "$PICOPASTE_NEWOSP_REF"
          git -C "$HOME/newosp-windows" checkout --detach FETCH_HEAD

      # Pin the formatter. Without this the gate's verdict depends on whichever
      # clang-format the runner image happens to ship (and used to PASS without
      # checking anything when none was present). A venv sidesteps PEP 668's
      # externally-managed-Python block on Ubuntu; the version must match what
      # developers run locally, so bump it and reformat in the same commit.
      - name: Install pinned clang-format
        run: |
          python3 -m venv "$HOME/.clang-format-venv"
          "$HOME/.clang-format-venv/bin/pip" install --quiet "clang-format==22.1.1"
          "$HOME/.clang-format-venv/bin/clang-format" --version

      # The integration tests shell out to `ssh -s localhost sftp` and rely on
      # ssh's own host-key checking, so a runner without a trusted local sshd
      # makes every one of them SKIP -- the SFTP layer would never be exercised.
      # Start a loopback-only sshd on port 2222 and pin the name `localhost` to
      # that port in ~/.ssh/config; the tests' unmodified ssh command honours it
      # (first matching Host block wins, so no other config may pre-empt it).
      # Port >1024 and same-user auth mean no root is needed; fresh keys every
      # run make a stale known_hosts entry impossible.
      - name: Start local sshd for SFTP integration tests
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          fi
          # sshd's privilege-separation directory; the runner user cannot make
          # it under /run on its own.
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/ci_host_ed25519 -N '' -q
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N '' -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          cat > ~/.ssh/ci_sshd_config <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $HOME/.ssh/ci_host_ed25519
          PidFile $HOME/.ssh/ci_sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          UsePAM no
          # Loopback-only daemon on an ephemeral runner; StrictModes would only
          # add a home-directory-permissions failure mode we cannot control.
          StrictModes no
          Subsystem sftp /usr/lib/openssh/sftp-server
          EOF
          # -t validates the config before anything depends on it; -E captures
          # sshd's own log, which is otherwise discarded and turns a failure
          # into silence. Production runs tsshd, but tsshd executes whatever
          # `Subsystem sftp` names in sshd_config, so the SFTP server on the
          # other end is this same sftp-server binary either way.
          /usr/sbin/sshd -t -f ~/.ssh/ci_sshd_config
          /usr/sbin/sshd -f ~/.ssh/ci_sshd_config -E ~/.ssh/ci_sshd.log
          # AddressFamily inet is load-bearing. sshd listens on 127.0.0.1 only,
          # and on this image `localhost` resolves to ::1 first, so without this
          # every connection is refused by an address nothing is listening on --
          # which is exactly how the first attempt failed: sshd was up and
          # listening (ss showed 127.0.0.1:2222), yet keyscan never got an answer.
          cat > ~/.ssh/config <<'EOF'
          Host localhost
            AddressFamily inet
            Port 2222
          EOF
          chmod 600 ~/.ssh/config
          # Wait for the listener, then trust its host key under the alias the
          # tests connect with ([localhost]:2222 for a non-default port). -4
          # matches AddressFamily above so keyscan probes the address the client
          # will actually use.
          up=no
          for _ in $(seq 1 20); do
            if ssh-keyscan -4 -p 2222 -T 2 localhost 2>/dev/null | grep -q .; then
              up=yes
              break
            fi
            sleep 1
          done
          if [ "$up" != yes ]; then
            echo "::error::sshd never listened on 2222 -- diagnostics follow"
            echo "--- sshd processes ---"; pgrep -a sshd || echo "  none"
            echo "--- listeners ---"; ss -ltn 2>/dev/null | head -20 || true
            echo "--- sshd log ---"; cat ~/.ssh/ci_sshd.log 2>/dev/null || echo "  no log"
            echo "--- effective config ---"; cat ~/.ssh/ci_sshd_config
            exit 1
          fi
          ssh-keyscan -4 -p 2222 localhost >> ~/.ssh/known_hosts
          # Fail loudly if passwordless ssh still does not work rather than
          # letting the integration tests quietly report SKIP.
          if ! ssh -o BatchMode=yes -o LogLevel=ERROR -s localhost sftp </dev/null; then
            echo "::error::passwordless ssh to the local sshd failed"
            echo "--- sshd log ---"; cat ~/.ssh/ci_sshd.log 2>/dev/null || true
            exit 1
          fi
          echo "local sftp subsystem is up"

      - name: Configure
        run: |
          FLAGS=""
          if [ "${{ matrix.sanitizer }}" != "none" ]; then
            FLAGS="-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.sanitizer }} -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.sanitizer }}"
          fi
          cmake -S . -B build -DPICOPASTE_BUILD_TESTS=ON -DPICOPASTE_WERROR=ON \
            -DPICOPASTE_NEWOSP_DIR="$HOME/newosp-windows" \
            -DPICOPASTE_CLANG_FORMAT="$HOME/.clang-format-venv/bin/clang-format" $FLAGS

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Runs the full ctest suite, which includes the mechanical gates
      # (gate_no_scripts, gate_posix_leak, gate_clang_format) registered in
      # tests/CMakeLists.txt. gate_clang_format is enforced here with the pinned
      # binary above, and the Windows job pins the very same version.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows / msvc (build + smoke)
    # This is the ONLY gate that can catch MSVC-only blockers. A mingw
    # cross-compile cannot: mingw defines __GNUC__ and ships pthread.h and
    # unistd.h, so it happily compiles headers that MSVC rejects.
    runs-on: windows-latest
    # Needed only by the tag-gated publish step at the end of this job. Pull
    # requests from forks get a read-only token regardless, so this grants
    # nothing to untrusted code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newosp
        shell: pwsh
        # Same commit pin as the Linux job; `clone --branch` cannot take a SHA,
        # so fetch the commit and detach. Must land at
        # $env:USERPROFILE/newosp-windows for the Configure step below.
        run: |
          git init "$env:USERPROFILE/newosp-windows"
          git -C "$env:USERPROFILE/newosp-windows" remote add origin "$env:PICOPASTE_NEWOSP_REPO"
          git -C "$env:USERPROFILE/newosp-windows" fetch --depth 1 origin "$env:PICOPASTE_NEWOSP_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:USERPROFILE/newosp-windows" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pinned to the same version the Linux job installs, and for the same
      # reason. This is not belt-and-braces: windows-latest DOES ship
      # clang-format on PATH (the image carries LLVM), so an unpinned gate
      # still runs here -- it just judges the tree with whatever version the
      # image happens to carry, which can differ from the Linux job's. Two
      # verdicts on one source, with no change in this repo, is precisely the
      # false confidence the gate exists to remove. Naming the binary makes
      # this job's verdict reproducible instead.
      - name: Install pinned clang-format
        shell: pwsh
        run: |
          python -m venv "$env:USERPROFILE\.clang-format-venv"
          & "$env:USERPROFILE\.clang-format-venv\Scripts\python.exe" -m pip install --quiet "clang-format==22.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\.clang-format-venv\Scripts\clang-format.exe" --version

      - name: Configure
        shell: pwsh
        # Pass the newosp path explicitly: the CMake default is $ENV{HOME} and
        # Windows runners do not guarantee HOME==USERPROFILE. The formatter is
        # named for the same reason the Linux job names one -- an unset value
        # sends the gate back to PATH, which is the drift this pin removes.
        run: cmake -S . -B build -A x64 -DPICOPASTE_BUILD_TESTS=ON -DPICOPASTE_WERROR=ON -DPICOPASTE_NEWOSP_DIR="$env:USERPROFILE/newosp-windows" -DPICOPASTE_CLANG_FORMAT="$env:USERPROFILE\.clang-format-venv\Scripts\clang-format.exe"

      - name: Build
        run: cmake --build build --config Release

      # ctest includes the CMake-script gates registered in tests/CMakeLists.txt
      # (gate_no_scripts, gate_posix_leak, gate_clang_format); gate_posix_leak
      # correctly excludes src/platform/posix/, which is legitimate POSIX and
      # not built on Windows. gate_clang_format runs here against the same
      # pinned version the Linux job installs.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Published only on a `v*` tag, and only after Test has passed, so the
      # attached binary is the exact one ctest just exercised -- rebuilding it
      # in a separate job would ship something the smoke test never touched.
      # `gh` ships on the runner, which avoids adding a third-party release
      # action to the supply chain for one step.
      - name: Publish the executable as a release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "build/Release/picopaste.exe"
          if (-not (Test-Path $exe)) { throw "the build produced no $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The version belongs in the asset name: two releases each attaching
          # a bare `picopaste.exe` are indistinguishable once downloaded.
          $asset = "dist/picopaste-$env:GITHUB_REF_NAME-windows-x64.exe"
          Copy-Item $exe $asset
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $asset --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" $asset `
              --title "picopaste $env:GITHUB_REF_NAME" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "published $asset"
